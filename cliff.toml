# git-cliff configuration for Tack.
[changelog]
header_marker = "<!-- git-cliff: end of header -->"
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.breaking %} (**breaking**){% endif %}
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "新增" },
    { message = "^fix", group = "修复" },
    { message = "^refactor", group = "重构" },
    { message = "^perf", group = "优化" },
    { message = "^docs", group = "文档" },
    { message = "^test", group = "测试" },
    { message = "^build|^ci", group = "构建与部署" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "维护" },
    { message = ".*", group = "其他" },
]
